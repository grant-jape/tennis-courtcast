name: Update forecast

on:
  schedule:
    # The main timer is a Cloudflare Worker (cron/forecast-trigger.js) that starts this workflow every 2 hours.
    # GitHub's own schedule is best-effort (often hours late), so it's only a backup now.
    - cron: "47 */6 * * *"
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    paths: ["courts.csv", "courtcast/**", "site/**", ".github/workflows/update.yml"]

permissions:
  contents: write   # commit the daily snapshot
  pages: write      # publish the map
  id-token: write

concurrency:
  # One queue per branch. GitHub keeps only ONE waiting run per group, and a newer one cancels it,
  # so with a shared group a push to a preview branch (or staging) could cancel a waiting live
  # deploy from main (it did on 2026-11-24). Runs on main (pushes, timer, manual) still share a
  # queue, so two forecast builds never overlap, and the newest main run publishes the latest site.
  group: update-forecast-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Only the default branch publishes the live map and commits snapshots;
    # pushes to preview branches don't touch the live site.
    # (Scheduled runs always use the default branch, and their event has no
    # repository info, so the check applies to pushes only.)
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # the previous commit too, to see what a push changed

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the scoring rules
        run: python -m unittest discover -s tests -t .

      # Each fresh forecast costs ~620 of Open-Meteo's 10,000 free daily calls, so only the
      # 2-hour timer (and changes to the courts or the build itself) fetch new weather.
      - name: Decide whether to fetch new weather
        id: plan
        run: |
          fetch=yes
          if [ "${{ github.event_name }}" = "push" ] && ! git diff --name-only HEAD^1 HEAD | grep -qE '^(courts\.csv|courtcast/)'; then
            fetch=no; echo "Only the website changed: reusing the live forecast."
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            age=$(curl -sfL https://tenniscourtcast.com/data/forecast.json | python3 -c "import sys, json, datetime as d; g = d.datetime.strptime(json.load(sys.stdin)['generated_utc'], '%Y-%m-%dT%H:%MZ').replace(tzinfo=d.timezone.utc); print(int((d.datetime.now(d.timezone.utc) - g).total_seconds() // 60))" || echo 9999)
            if [ "$age" -lt 100 ]; then
              fetch=no; echo "The live forecast is ${age} min old (the 2-hour timer is working): reusing it."
            fi
          fi
          echo "fetch=$fetch" >> "$GITHUB_OUTPUT"

      - name: Fetch forecast and build map data
        id: forecast
        if: steps.plan.outputs.fetch == 'yes'
        continue-on-error: true   # a weather-API outage shouldn't block publishing site changes
        timeout-minutes: 15
        env:
          # Paid Open-Meteo key (commercial licence). Unset = the free API. Set it with:
          #   gh secret set OPEN_METEO_API_KEY
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
        run: python -m courtcast.build --out site/data/forecast.json --snapshot-dir data/snapshots

      - name: Use the last published forecast (not fetching, or the fetch failed)
        if: steps.plan.outputs.fetch == 'no' || steps.forecast.outcome == 'failure'
        run: |
          if [ "${{ steps.forecast.outcome }}" = "failure" ]; then
            echo "::warning::Forecast fetch failed; publishing with the last good forecast data."
          fi
          mkdir -p site/data
          curl -sfL --retry 3 "https://tenniscourtcast.com/data/forecast.json" -o site/data/forecast.json

      - name: Commit the daily snapshot (first run of each Pacific day)
        if: steps.forecast.outcome == 'success'
        run: |
          # Commits authored with the GitHub noreply address count toward the
          # contribution graph without exposing a personal email.
          git config user.name "Grant Jape"
          git config user.email "190882422+grant-jape@users.noreply.github.com"
          git add data/snapshots
          if git diff --cached --quiet; then
            echo "Already have today's snapshot; nothing to commit."
          else
            day=$(TZ=America/Los_Angeles date +%F)
            git commit -m "data: forecast snapshot for $day"
            git pull --rebase --quiet
            git push
          fi

      - name: Stamp asset links with the commit, so phones fetch fresh code after each update
        run: |
          v="${GITHUB_SHA::7}"
          sed -i "s|href=\"style.css\"|href=\"style.css?v=$v\"|; s|src=\"app.js\"|src=\"app.js?v=$v\"|" site/index.html
          grep -o 'style.css?v=[0-9a-f]*\|app.js?v=[0-9a-f]*' site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
