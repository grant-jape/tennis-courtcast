<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IE CourtCast</title>
  <meta name="description" content="Court-by-court tennis weather for the Inland Empire: wind, rain and a playability score on a map.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>IE CourtCast</h1>
      <span id="updated" class="muted">Loading forecast…</span>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Map layer">
        <button data-layer="play" aria-pressed="true">Playability</button>
        <button data-layer="wind" aria-pressed="false">Wind</button>
        <button data-layer="rain" aria-pressed="false">Rain</button>
      </div>
      <label class="check"><input type="checkbox" id="schools"> School courts</label>
    </div>
  </header>

  <main class="layout">
    <section class="mapwrap">
      <div id="map" aria-label="Map of courts and conditions"></div>
      <div class="legend" id="legend"></div>
    </section>

    <aside class="panel">
      <h2 id="listTitle">Best courts</h2>
      <ol id="list" class="list"></ol>
    </aside>
  </main>

  <footer class="timebar">
    <button id="prev" aria-label="Previous hour">‹</button>
    <div class="slider">
      <input type="range" id="hour" min="0" max="35" value="0" aria-label="Forecast hour">
      <div class="timeinfo"><strong id="timeLabel">—</strong> <span id="dayLabel" class="muted"></span></div>
    </div>
    <button id="next" aria-label="Next hour">›</button>
    <button id="now" class="nowbtn">Now</button>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
